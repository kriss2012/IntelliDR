name: IntelliDR CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellidr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: Test, Benchmark & Quality Audit
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # CHECKOUT
      # ==========================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================================
      # PYTHON
      # ==========================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ==========================================================
      # ENVIRONMENT INFORMATION
      # ==========================================================
      - name: Show Environment
        run: |
          python --version
          python -m pip --version
          echo "Working directory:"
          pwd

      # ==========================================================
      # VERIFY PROJECT STRUCTURE
      # ==========================================================
      - name: Verify IntelliDR Project Structure
        shell: bash
        run: |
          echo "===== ROOT DIRECTORY ====="
          ls -la

          echo
          echo "===== IMPORTANT DIRECTORIES ====="

          test -f requirements.txt \
            && echo "✓ requirements.txt found" \
            || { echo "✗ requirements.txt missing"; exit 1; }

          test -d tests \
            && echo "✓ tests/ found" \
            || { echo "✗ tests/ missing"; exit 1; }

          test -d edge \
            && echo "✓ edge/ found" \
            || { echo "✗ edge/ missing"; exit 1; }

          test -f scripts/final_audit.py \
            && echo "✓ scripts/final_audit.py found" \
            || { echo "✗ scripts/final_audit.py missing"; exit 1; }

          echo
          echo "===== EDGE DIRECTORY ====="
          find edge -maxdepth 3 -type f | sort

          echo
          echo "===== TEST DIRECTORY ====="
          find tests -maxdepth 3 -type f | sort

          echo
          echo "===== SCRIPTS DIRECTORY ====="
          find scripts -maxdepth 2 -type f | sort

      # ==========================================================
      # UPGRADE BUILD TOOLS
      # ==========================================================
      - name: Upgrade Python Build Tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # ==========================================================
      # INSTALL ROOT DEPENDENCIES
      # ==========================================================
      - name: Install Project Dependencies
        run: |
          python -m pip install -r requirements.txt

      # ==========================================================
      # INSTALL EDGE PACKAGE
      # ==========================================================
      - name: Install IntelliDR Edge Package
        shell: bash
        run: |
          if [ -f "edge/pyproject.toml" ]; then
            echo "✓ edge/pyproject.toml found"
            python -m pip install -e ./edge

          elif [ -f "edge/setup.py" ]; then
            echo "✓ edge/setup.py found"
            python -m pip install -e ./edge

          else
            echo "✗ edge/ is not a Python package"
            echo
            echo "Expected one of:"
            echo "  edge/pyproject.toml"
            echo "  edge/setup.py"
            echo
            echo "Current edge contents:"
            find edge -maxdepth 3 -type f | sort
            exit 1
          fi

      # ==========================================================
      # TEST DEPENDENCIES
      # ==========================================================
      - name: Install CI Dependencies
        run: |
          python -m pip install \
            pytest \
            pytest-cov \
            fastapi \
            uvicorn \
            pydantic

      # ==========================================================
      # VERIFY INSTALLATION
      # ==========================================================
      - name: Verify IntelliDR Installation
        shell: bash
        run: |
          python - <<'PY'
          import sys

          print("Python:", sys.version)

          try:
              import intellidr_edge

              print("✓ intellidr_edge imported successfully")
              print("Package:", intellidr_edge.__file__)

          except Exception as exc:
              print("✗ Failed to import intellidr_edge")
              print(f"{type(exc).__name__}: {exc}")
              raise
          PY

      # ==========================================================
      # DISCOVER TESTS
      # ==========================================================
      - name: Discover Tests
        run: |
          echo "===== TEST FILES ====="
          find tests -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            -print

      # ==========================================================
      # RUN TESTS
      # ==========================================================
      - name: Run Unit & Integration Tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --color=yes

      # ==========================================================
      # RUN BENCHMARK
      # ==========================================================
      - name: Run SIH Benchmark Suite
        shell: bash
        run: |
          python -m intellidr_edge.cli.main benchmark

      # ==========================================================
      # FINAL QUALITY AUDIT
      # ==========================================================
      - name: Run Final Quality Gate Audit
        shell: bash
        run: |
          python scripts/final_audit.py

      # ==========================================================
      # PACKAGE VALIDATION
      # ==========================================================
      - name: Validate Python Packages
        run: |
          python -m pip check

      # ==========================================================
      # GENERATE TEST REPORT
      # ==========================================================
      - name: Generate Test Report
        if: always()
        shell: bash
        run: |
          mkdir -p ci-reports

          python -m pytest tests/ \
            --tb=short \
            --junitxml=ci-reports/pytest.xml \
            || true

      # ==========================================================
      # UPLOAD CI ARTIFACTS
      # ==========================================================
      - name: Upload CI Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intellidr-ci-reports
          path: |
            ci-reports/
            reports/
            test-results/
            benchmark-results/
            artifacts/
          if-no-files-found: ignore
