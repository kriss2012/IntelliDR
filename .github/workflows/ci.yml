name: IntelliDR CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intellidr-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-audit:
    name: IntelliDR Tests, Benchmark & Audit
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. PYTHON
      # ============================================================
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # ============================================================
      # 3. ENVIRONMENT
      # ============================================================
      - name: Show Environment
        run: |
          echo "=============================================="
          echo " IntelliDR CI Environment"
          echo "=============================================="

          python --version
          python -m pip --version

          echo
          echo "Working directory:"
          pwd

          echo
          echo "Repository:"
          git remote -v

      # ============================================================
      # 4. VERIFY PROJECT STRUCTURE
      # ============================================================
      - name: Verify Project Structure
        shell: bash
        run: |
          set -e

          echo "=============================================="
          echo " Checking IntelliDR Project Structure"
          echo "=============================================="

          required_files=(
            "requirements.txt"
            "tests/test_backend_api.py"
            "edge/setup.py"
            "edge/intellidr_edge/cli/main.py"
            "scripts/final_audit.py"
            "backend/main.py"
          )

          for file in "${required_files[@]}"; do
            if [ -f "$file" ]; then
              echo "✓ $file"
            else
              echo "✗ Missing: $file"
              exit 1
            fi
          done

          echo
          echo "Project structure verified."

      # ============================================================
      # 5. UPGRADE BUILD TOOLS
      # ============================================================
      - name: Upgrade Python Build Tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

      # ============================================================
      # 6. INSTALL PROJECT DEPENDENCIES
      # ============================================================
      - name: Install Project Dependencies
        run: |
          python -m pip install -r requirements.txt

      # ============================================================
      # 7. INSTALL EDGE ENGINE
      # ============================================================
      - name: Install IntelliDR Edge Engine
        run: |
          python -m pip install -e ./edge

      # ============================================================
      # 8. INSTALL BACKEND + TEST DEPENDENCIES
      # ============================================================
      #
      # IMPORTANT:
      # httpx2 is required by the Starlette TestClient used by
      # tests/test_backend_api.py.
      #
      # The previous workflow did NOT install it.
      #
      # ============================================================
      - name: Install Backend & Test Dependencies
        run: |
          python -m pip install \
            fastapi \
            uvicorn \
            pydantic \
            pytest \
            pytest-cov \
            httpx2

      # ============================================================
      # 9. VERIFY CRITICAL IMPORTS
      # ============================================================
      - name: Verify Critical Python Imports
        run: |
          python - <<'PY'
          import sys

          print("Python:", sys.version)

          # FastAPI
          import fastapi
          print("✓ FastAPI:", fastapi.__version__)

          # Pydantic
          import pydantic
          print("✓ Pydantic:", pydantic.__version__)

          # Pytest
          import pytest
          print("✓ Pytest:", pytest.__version__)

          # TestClient
          from fastapi.testclient import TestClient
          print("✓ FastAPI TestClient")

          # Edge engine
          import intellidr_edge
          print("✓ intellidr_edge:", intellidr_edge.__file__)

          # Core engine
          import intellidr_core
          print("✓ intellidr_core:", intellidr_core.__file__)

          print()
          print("All critical imports passed.")
          PY

      # ============================================================
      # 10. VERIFY TESTCLIENT SPECIFICALLY
      # ============================================================
      - name: Verify FastAPI TestClient
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from backend.main import app

          client = TestClient(app)

          response = client.get("/")

          print("HTTP status:", response.status_code)
          print("Response:", response.json())

          assert response.status_code == 200
          assert response.json()["project"] == "IntelliDR"

          print("✓ FastAPI TestClient verification passed.")
          PY

      # ============================================================
      # 11. CHECK PYTHON DEPENDENCIES
      # ============================================================
      - name: Validate Python Dependencies
        run: |
          python -m pip check

      # ============================================================
      # 12. SHOW TEST FILES
      # ============================================================
      - name: Discover Tests
        run: |
          echo "=============================================="
          echo " IntelliDR Test Suite"
          echo "=============================================="

          find tests \
            -type f \
            \( -name "test_*.py" -o -name "*_test.py" \) \
            -print | sort

      # ============================================================
      # 13. RUN UNIT + INTEGRATION TESTS
      # ============================================================
      - name: Run Unit & Integration Tests
        run: |
          python -m pytest tests/ \
            -v \
            --tb=short \
            --color=yes \
            --junitxml=test-results.xml

      # ============================================================
      # 14. RUN SIH BENCHMARK
      # ============================================================
      - name: Run SIH Benchmark Suite
        run: |
          python -m intellidr_edge.cli.main benchmark

      # ============================================================
      # 15. VERIFY BENCHMARK COMPLETION
      # ============================================================
      - name: Verify Benchmark Result
        run: |
          echo "Benchmark command completed successfully."

          if [ -f "data/evaluation/benchmark_results.json" ]; then
            echo "✓ Benchmark results file found."
            cat data/evaluation/benchmark_results.json
          else
            echo "ℹ Benchmark results file not generated."
            echo "CLI benchmark completed successfully."
          fi

      # ============================================================
      # 16. RUN FINAL QUALITY AUDIT
      # ============================================================
      - name: Run Final Quality Gate Audit
        run: |
          python scripts/final_audit.py

      # ============================================================
      # 17. UPLOAD TEST RESULTS
      # ============================================================
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intellidr-test-results
          path: |
            test-results.xml
            reports/
            test-results/
            benchmark-results/
          if-no-files-found: ignore

      # ============================================================
      # 18. FINAL SUCCESS MESSAGE
      # ============================================================
      - name: CI Success
        if: success()
        run: |
          echo "=============================================="
          echo "       INTELLIDR CI PIPELINE PASSED"
          echo "=============================================="
          echo "✓ Dependencies installed"
          echo "✓ FastAPI TestClient verified"
          echo "✓ Unit tests passed"
          echo "✓ Integration tests passed"
          echo "✓ SIH benchmark passed"
          echo "✓ Final audit passed"
          echo "=============================================="
